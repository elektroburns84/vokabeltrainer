<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7a35">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Vokabeltrainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: eine schmale Spalte (max. 40rem). Einrichten, Abfragen und Ergebnis sind drei Ansichten derselben Seite. */
:root {
  --bg: #eff5f0;
  --surface: #ffffff;
  --fg: #13261a;
  --muted: #51655a;
  --line: #cddbd0;
  --accent: #1b7a35;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe0;
  --good: #1b7a35;
  --good-soft: #dcefe0;
  --bad: #b83a0f;
  --bad-soft: #fbe5dc;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a12; --surface: #16261c; --fg: #e6f2e9; --muted: #9db3a3; --line: #2a4032;
    --accent: #62d083; --accent-fg: #07210f; --accent-soft: #1c3a27;
    --good: #7be0a0; --good-soft: #173a27; --bad: #ff9a72; --bad-soft: #412319;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a12; --surface: #16261c; --fg: #e6f2e9; --muted: #9db3a3; --line: #2a4032;
    --accent: #62d083; --accent-fg: #07210f; --accent-soft: #1c3a27;
    --good: #7be0a0; --good-soft: #173a27; --bad: #ff9a72; --bad-soft: #412319;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 40rem; margin: 0 auto; }
h1, h2, .display { font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1.1; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.sub { color: var(--muted); margin: 0; }
.stack { display: flex; flex-direction: column; gap: 24px; }
.head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 6px; cursor: pointer; font-weight: 700; border-radius: 6px; }

/* Lektions-Chips */
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.4rem, 1fr)); gap: 8px; }
.chip { position: relative; display: block; }
.sections { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.sections:empty { display: none; }
.unitbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.unitbox summary { padding: 12px 14px; cursor: pointer; font-family: var(--font-display); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.unitbox summary small { color: var(--muted); font-family: var(--font-body); font-weight: 400; font-size: 0.9rem; white-space: nowrap; }
.unitbtns { padding: 2px 8px; border-top: 1px solid var(--line); display: flex; gap: 4px; }
.wlist { max-height: 22rem; overflow-y: auto; border-top: 1px solid var(--line); }
.w { position: relative; display: flex; gap: 12px; align-items: center; padding: 9px 14px; cursor: pointer; border-top: 1px solid var(--line); }
.w:first-child { border-top: 0; }
.w .wbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; flex: none; }
.w .wbox svg { width: 14px; height: 14px; opacity: 0; }
.w input:checked + .wbox { background: var(--accent); border-color: var(--accent); }
.w input:checked + .wbox svg { opacity: 1; stroke: var(--accent-fg); }
.w input:focus-visible + .wbox { outline: 3px solid var(--accent); outline-offset: 2px; }
.wtxt { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.wtxt em { font-style: normal; color: var(--muted); font-size: 0.92rem; }
.chip input, .seg input, .toggle input, .w input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; min-height: 3.2rem; }
.chip b { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.chip small { color: var(--muted); font-size: 0.8rem; }
.chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); }
.chip input:focus-visible + span, .seg input:focus-visible + span, .toggle input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Segmentierte Auswahl */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { flex: 1 1 8rem; position: relative; }
.seg span { display: block; text-align: center; padding: 10px 12px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.seg.small label { flex: 1 1 3.5rem; }
#bandSeg label { flex: 1 1 5rem; }

.toggles { display: flex; flex-direction: column; gap: 4px; }
.toggle { position: relative; display: flex; gap: 12px; align-items: center; padding: 8px 0; cursor: pointer; }
.toggle .box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; flex: none; }
.toggle .box svg { width: 16px; height: 16px; opacity: 0; }
.toggle input:checked + .box { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .box svg { opacity: 1; stroke: var(--accent-fg); }
.toggle input:disabled ~ .t-text { color: var(--muted); }
.toggle .t-text { min-width: 0; }

.startbar {
  position: sticky; bottom: 0; margin-top: 28px; margin-inline: -16px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.startbar .count { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.startbar small { display: block; color: var(--muted); font-family: var(--font-body); font-weight: 400; font-size: 0.85rem; }

.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 700; min-height: 46px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.good { background: var(--good); border-color: var(--good); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.big { padding: 13px 26px; font-size: 1.05rem; }
.btn.grow { flex: 1 1 8rem; }

/* Abfrage */
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 18px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.lang { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.prompt { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.15; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.iconbtn { border: 1.5px solid var(--line); background: transparent; border-radius: 10px; width: 44px; height: 44px; display: inline-grid; place-items: center; cursor: pointer; color: var(--fg); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.promptrow { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.promptrow > div { min-width: 0; }
.answer { display: flex; flex-direction: column; gap: 10px; }
.field-label { font-weight: 700; font-size: 0.95rem; }
.answer input[type=text] { width: 100%; font-size: 1.25rem; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); }
.answer input[type=text]:focus { border-color: var(--accent); outline: none; }
.feedback { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.fb-head { display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.feedback.good .fb-head { color: var(--good); }
.feedback.bad .fb-head { color: var(--bad); }
.fb-head svg { width: 22px; height: 22px; }
.feedback p { margin: 0; }
.typed s { color: var(--muted); }
.correct { font-size: 1.25rem; font-weight: 700; overflow-wrap: anywhere; }
.flipped { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

/* Ergebnis */
.score { font-family: var(--font-display); font-size: clamp(2.6rem, 14vw, 4rem); font-weight: 700; line-height: 1; margin: 6px 0; }
.score small { font-size: 1.1rem; color: var(--muted); font-weight: 500; margin-left: 6px; }
.misslist { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.misslist li { padding: 10px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--line); }
.misslist li:first-child { border-top: 0; }
.misslist li > span { min-width: 0; overflow-wrap: anywhere; }
.misslist .de { color: var(--muted); }
@media (max-width: 420px) { .misslist li { grid-template-columns: 1fr; gap: 2px; } }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }

/* Mobile: Abfrage hat Vorrang, Einstellungen sind kompakt */
.setup-head { flex-direction: row; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.setup-head h1 { font-size: 1.5rem; }
.setup-head .btn { min-height: 40px; padding: 8px 14px; white-space: nowrap; }
.qbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.qbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px 6px 10px; min-height: 40px; cursor: pointer; font-weight: 700; font-size: 0.92rem; }
.qbtn svg { width: 18px; height: 18px; }
.qcount { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.progress { height: 6px; margin-bottom: 12px; }
#quiz .card { padding: 16px; gap: 12px; }
#quiz .prompt { font-size: clamp(1.9rem, 8.5vw, 2.6rem); }
#quiz .btn { min-height: 52px; }
#quiz .answer input[type=text] { padding: 12px 14px; }
#quiz .field-label { font-size: 0.85rem; color: var(--muted); }
.stack { gap: 18px; }
.chips { grid-template-columns: repeat(auto-fill, minmax(4.9rem, 1fr)); gap: 6px; }
.chip span { padding: 7px 10px; min-height: 2.9rem; }
.chip small { font-size: 0.75rem; }
.seg { gap: 6px; }
.seg span { padding: 9px 8px; }
.seg.small label { flex: 1 1 2.6rem; }
h2 { margin-bottom: 8px; }
.toggle { padding: 6px 0; }
@media (max-width: 600px) {
  body { padding-block: 10px 14px; font-size: 16px; }
  .startbar { margin-top: 18px; }
}
.seg.nowrap { flex-wrap: nowrap; }
.seg.nowrap label { flex: 1 1 0; min-width: 0; }
.setup-head .sub { font-size: 0.9rem; }
.setup-head > div { min-width: 0; flex: 1 1 auto; }
.setup-head .btn { flex: none; }
[hidden] { display: none !important; }

#lock { max-width: 26rem; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 14px; }
#lock h1 { font-size: 1.6rem; margin: 0; }
#lock p { margin: 0; color: var(--muted); }
#lock .field { display: flex; gap: 8px; }
#lock input[type=password], #lock input[type=text] { flex: 1 1 auto; min-width: 0; font-size: 1.2rem; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); letter-spacing: 0.04em; }
#lock input:focus { border-color: var(--accent); outline: none; }
#lock .err { color: var(--bad); font-weight: 700; min-height: 1.4em; }
#lock label.rem { display: flex; gap: 10px; align-items: center; cursor: pointer; }
#lock label.rem input { width: 20px; height: 20px; accent-color: var(--accent); }
</style>
</head>
<body>
<section id="lock">
  <h1>Vokabeltrainer</h1>
  <p>Bitte gib den Zugangscode ein.</p>
  <form id="lockForm" class="stack" style="gap:12px">
    <div class="field"><input id="code" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Zugangscode"><button type="button" class="btn ghost" id="showBtn">Zeigen</button></div>
    <label class="rem"><input type="checkbox" id="rem" checked><span>Auf diesem Gerät merken</span></label>
    <div class="err" id="lockErr" role="alert"></div>
    <button class="btn primary big" type="submit" id="lockBtn">Öffnen</button>
  </form>
</section>
<main id="app" hidden>
  <section id="setup" class="stack">
    <div class="head setup-head">
      <div><h1>Einstellungen</h1><p class="sub" id="meta">Band 1</p></div>
      <button class="btn ghost" type="button" id="backToRound" hidden>Zur Abfrage</button>
    </div>

    <div>
      <h2>Band</h2>
      <div class="seg small nowrap" id="bandSeg">
        <label><input type="radio" name="band" value="1"><span>1</span></label>
        <label><input type="radio" name="band" value="2"><span>2</span></label>
        <label><input type="radio" name="band" value="3"><span>3</span></label>
        <label><input type="radio" name="band" value="4"><span>4</span></label>
        <label><input type="radio" name="band" value="5"><span>5</span></label>
        <label><input type="radio" name="band" value="6"><span>6</span></label>
      </div>
    </div>

    <div>
      <div class="row between"><h2>Lektionen</h2>
        <span><button class="linkbtn" type="button" id="allBtn">Alle</button><button class="linkbtn" type="button" id="noneBtn">Keine</button></span>
      </div>
      <div class="chips" id="lessons"></div>
      <div class="sections" id="sections"></div>
    </div>

    <div>
      <h2>Abfragerichtung</h2>
      <div class="seg nowrap" id="dirSeg">
        <label><input type="radio" name="dir" value="en-de"><span>EN → DE</span></label>
        <label><input type="radio" name="dir" value="de-en"><span>DE → EN</span></label>
        <label><input type="radio" name="dir" value="mix"><span>Gemischt</span></label>
      </div>
    </div>

    <div>
      <h2>Art der Abfrage</h2>
      <div class="seg">
        <label><input type="radio" name="mode" value="type"><span>Eintippen</span></label>
        <label><input type="radio" name="mode" value="cards"><span>Karteikarten</span></label>
      </div>
    </div>

    <div>
      <h2>Anzahl pro Runde</h2>
      <div class="seg small">
        <label><input type="radio" name="count" value="10"><span>10</span></label>
        <label><input type="radio" name="count" value="20"><span>20</span></label>
        <label><input type="radio" name="count" value="50"><span>50</span></label>
        <label><input type="radio" name="count" value="all"><span>Alle</span></label>
      </div>
    </div>

    <div>
      <h2>Optionen</h2>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" name="random"><span class="box"><svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="t-text">Zufällige Reihenfolge</span></label>
        <label class="toggle"><input type="checkbox" name="speak"><span class="box"><svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="t-text">Englische Wörter automatisch vorlesen</span></label>
        <label class="toggle"><input type="checkbox" name="hard" id="hardBox"><span class="box"><svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="t-text" id="hardText">Nur schwierige Wörter</span></label>
      </div>
    </div>

    <div class="startbar">
      <div class="count" id="startInfo"></div>
      <button class="btn primary big" type="button" id="startBtn">Neue Runde starten</button>
    </div>
  </section>

  <section id="quiz" hidden></section>
  <section id="result" hidden></section>
</main>

<script>
function boot(BOOKS) {
const items = [];
const ORDER = {}, UNIT = {};
Object.keys(BOOKS).map(Number).sort((a, b) => a - b).forEach(b => {
  ORDER[b] = [];
  BOOKS[b].forEach(r => {
    const it = { id: items.length, b, u: r[0], en: r[1], de: r[2] };
    items.push(it);
    if (!ORDER[b].includes(r[0])) ORDER[b].push(r[0]);
    (UNIT[b + ':' + r[0]] = UNIT[b + ':' + r[0]] || []).push(it);
  });
});
const BANDS = Object.keys(ORDER).map(Number);
const LABEL = u => /^U\d$/.test(u) ? 'Unit ' + u.slice(1) : u;
const openUnits = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const cfg = Object.assign({ band: 1, lessons: {}, skip: {}, dir: 'en-de', mode: 'type', count: '20', speak: false, random: true, hard: false }, store.get('gl1-cfg') || {});
if (Array.isArray(cfg.lessons)) cfg.lessons = { 1: cfg.lessons };
if (!cfg.lessons || typeof cfg.lessons !== 'object') cfg.lessons = {};
BANDS.forEach(b => { cfg.lessons[b] = Array.isArray(cfg.lessons[b]) ? cfg.lessons[b].filter(u => ORDER[b].includes(u)) : [ORDER[b][0]]; });
if (!BANDS.includes(cfg.band)) cfg.band = BANDS[0];
if (!cfg.skip || typeof cfg.skip !== 'object') cfg.skip = {};
Object.keys(cfg.skip).forEach(k => {
  const v = cfg.skip[k];
  if (!Array.isArray(v) || v.some(x => typeof x !== 'number')) delete cfg.skip[k];
  else if (!k.includes(':')) { cfg.skip['1:' + k] = v; delete cfg.skip[k]; }
});
(Array.isArray(cfg.open) ? cfg.open : []).forEach(k => { if (UNIT[k]) openUnits.add(k); });
let hard = store.get('gl1-hard') || {};

/* ---------- Antwort prüfen ---------- */
const byEn = {}, byDe = {};
items.forEach(i => { (byEn[i.en] = byEn[i.en] || []).push(i); (byDe[i.de] = byDe[i.de] || []).push(i); });

function norm(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\([^)]*\)/g, ' ').replace(/…|\.{3}/g, ' ')
    .replace(/[.,!?;:"“”]/g, ' ').replace(/\s+/g, ' ').trim();
}
function expand(p) {
  let combos = [[]];
  for (const w of p.trim().split(/\s+/)) {
    let opts = [w];
    if (w.includes('/') && w.length > 1) {
      const parts = w.split('/'); const base = parts[0]; opts = [base];
      for (const q of parts.slice(1)) opts.push(q.startsWith('-') ? base + q.slice(1) : q);
    }
    combos = combos.flatMap(c => opts.map(o => [...c, o])).slice(0, 64);
  }
  return combos.map(c => c.join(' '));
}
const vcache = new Map();
function variants(text) {
  if (vcache.has(text)) return vcache.get(text);
  const out = new Set();
  text.split(';').forEach(alt => {
    [alt, ...alt.split(',')].forEach(p => {
      expand(p).forEach(v => {
        const n = norm(v); if (!n) return;
        out.add(n);
        if (n.startsWith('to ')) out.add(n.slice(3));
      });
    });
  });
  vcache.set(text, out);
  return out;
}
function check(it, dir, input) {
  const typed = norm(input); if (!typed) return false;
  const group = dir === 'en-de' ? byEn[it.en] : byDe[it.de];
  const key = dir === 'en-de' ? 'de' : 'en';
  return group.some(g => variants(g[key]).has(typed));
}

/* ---------- Vorlesen ---------- */
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/\([^)]*\)/g, '').replace(/…/g, '').replace(/\(?\bBE\b\)?|\(AE\)/g, ''));
    u.lang = 'en-GB'; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

const ICON = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>',
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/></svg>'
};

/* ---------- Einrichtung ---------- */
function pool() {
  let p = items.filter(i => i.b === cfg.band && cfg.lessons[cfg.band].includes(i.u) && !(cfg.skip[i.b + ':' + i.u] || []).includes(i.id));
  if (cfg.hard) p = p.filter(i => hard[i.id]);
  return p;
}
function sessionSize() { const n = pool().length; return cfg.count === 'all' ? n : Math.min(n, +cfg.count); }

function buildSetup() { buildLessons(); syncSetup(); }
function buildLessons() {
  const b = cfg.band;
  $('#meta').textContent = 'Band ' + b + ' · ' + items.filter(i => i.b === b).length + ' Vokabeln';
  $('#lessons').innerHTML = ORDER[b].map(u => {
    const n = UNIT[b + ':' + u].length;
    return `<label class="chip"><input type="checkbox" name="lesson" value="${u}"><span><b>${LABEL(u)}</b><small>${n} Wörter</small></span></label>`;
  }).join('');
}
function renderSections() {
  const b = cfg.band;
  $('#sections').innerHTML = cfg.lessons[b].map(u => {
    const key = b + ':' + u;
    const skip = cfg.skip[key] || [];
    const words = UNIT[key].map(i => `<label class="w"><input type="checkbox" name="word" value="${i.id}" ${skip.includes(i.id) ? '' : 'checked'}><span class="wbox"><svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="wtxt"><b>${esc(i.en)}</b><em>${esc(i.de)}</em></span></label>`).join('');
    return `<details class="unitbox" data-u="${key}" ${openUnits.has(key) ? 'open' : ''}><summary id="sum-${key}"></summary><div class="unitbtns"><button type="button" class="linkbtn" data-act="all" data-u="${key}">Alle</button><button type="button" class="linkbtn" data-act="none" data-u="${key}">Keine</button></div><div class="wlist">${words}</div></details>`;
  }).join('');
  cfg.lessons[b].forEach(u => refreshSummary(b + ':' + u));
}
function refreshSummary(key) {
  const el = document.getElementById('sum-' + key); if (!el) return;
  const list = UNIT[key], skip = cfg.skip[key] || [];
  const sel = list.filter(i => !skip.includes(i.id)).length;
  el.innerHTML = `<span>${LABEL(key.split(':')[1])}: Wörter auswählen</span><small>${sel} von ${list.length}</small>`;
}
function syncSetup() {
  document.querySelectorAll('input[name=band]').forEach(i => i.checked = +i.value === cfg.band);
  document.querySelectorAll('input[name=lesson]').forEach(i => i.checked = cfg.lessons[cfg.band].includes(i.value));
  renderSections();
  ['dir', 'mode', 'count'].forEach(n => document.querySelectorAll(`input[name=${n}]`).forEach(i => i.checked = i.value === cfg[n]));
  ['random', 'speak', 'hard'].forEach(n => { const el = document.querySelector(`input[name=${n}]`); el.checked = !!cfg[n]; });
  updateBar();
}
function updateBar() {
  const hc = Object.keys(hard).filter(id => items[+id] && items[+id].b === cfg.band).length;
  const box = $('#hardBox');
  $('#hardText').textContent = 'Nur schwierige Wörter üben (' + hc + ')';
  box.disabled = hc === 0;
  if (hc === 0 && cfg.hard) { cfg.hard = false; box.checked = false; }
  const n = sessionSize();
  $('#startInfo').innerHTML = n + (n === 1 ? ' Vokabel' : ' Vokabeln') + `<small>${cfg.mode === 'type' ? 'zum Eintippen' : 'als Karteikarten'}</small>`;
  $('#startBtn').disabled = n === 0;
}
$('#setup').addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'band') { cfg.band = +t.value; buildLessons(); syncSetup(); }
  else if (t.name === 'lesson') { cfg.lessons[cfg.band] = [...document.querySelectorAll('input[name=lesson]:checked')].map(i => i.value); renderSections(); }
  else if (t.name === 'word') {
    const id = +t.value, key = items[id].b + ':' + items[id].u;
    const skip = (cfg.skip[key] || []).filter(x => x !== id);
    if (!t.checked) skip.push(id);
    cfg.skip[key] = skip; refreshSummary(key);
  }
  else if (['dir', 'mode', 'count'].includes(t.name)) cfg[t.name] = t.value;
  else if (['random', 'speak', 'hard'].includes(t.name)) cfg[t.name] = t.checked;
  store.set('gl1-cfg', cfg); updateBar();
});
$('#allBtn').onclick = () => { cfg.lessons[cfg.band] = ORDER[cfg.band].slice(); store.set('gl1-cfg', cfg); syncSetup(); };
$('#noneBtn').onclick = () => { cfg.lessons[cfg.band] = []; store.set('gl1-cfg', cfg); syncSetup(); };
$('#startBtn').onclick = () => begin(pool(), false);

/* ---------- Ablauf ---------- */
let S = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let lastView = null;
function show(name) {
  if (name !== 'setup') lastView = name;
  ['setup', 'quiz', 'result'].forEach(n => $('#' + n).hidden = n !== name);
  $('#backToRound').hidden = !(name === 'setup' && lastView);
  window.scrollTo(0, 0);
}
function begin(list, unlimited) {
  let l = list.slice();
  if (cfg.random) shuffle(l);
  if (!unlimited && cfg.count !== 'all') l = l.slice(0, +cfg.count);
  S = {
    queue: l.map(it => ({ it, dir: cfg.dir === 'mix' ? (Math.random() < 0.5 ? 'en-de' : 'de-en') : cfg.dir })),
    total: l.length, learned: new Set(), missed: {}, firstTry: 0, flipped: false, pending: null, typed: ''
  };
  show('quiz'); render();
}
function resolve(ok) {
  const cur = S.queue.shift(); const id = cur.it.id;
  if (ok) {
    S.learned.add(id);
    if (!S.missed[id]) { S.firstTry++; delete hard[id]; }
  } else {
    S.missed[id] = (S.missed[id] || 0) + 1; hard[id] = 1;
    S.queue.splice(Math.min(S.queue.length, 4), 0, cur);
  }
  store.set('gl1-hard', hard);
  S.flipped = false; S.pending = null; S.typed = '';
  render();
}

function render() {
  const cur = S.queue[0];
  if (!cur) return finish();
  const { it, dir } = cur;
  const q = dir === 'en-de' ? it.en : it.de, a = dir === 'en-de' ? it.de : it.en;
  const qLang = dir === 'en-de' ? 'Englisch' : 'Deutsch', aLang = dir === 'en-de' ? 'Deutsch' : 'Englisch';
  const pct = Math.round(S.learned.size / S.total * 100);
  const qEn = dir === 'en-de', aEn = dir === 'de-en';
  const phase = S.pending ? 'feedback' : (S.flipped ? 'flipped' : 'ask');
  let body = '';

  if (cfg.mode === 'type') {
    if (phase === 'ask') {
      body = `<form id="answerForm" class="answer"><label class="field-label" for="answer">Auf ${aLang}</label>
        <input id="answer" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <div class="row"><button type="button" class="btn ghost" id="skipBtn">Weiß ich nicht</button><button class="btn primary grow" type="submit">Prüfen</button></div></form>`;
    } else {
      const ok = S.pending.ok;
      body = `<div class="feedback ${ok ? 'good' : 'bad'}"><div class="fb-head">${ok ? ICON.ok + 'Richtig' : ICON.no + 'Nicht ganz'}</div>
        ${!ok && S.typed ? `<p class="typed">Deine Antwort: <s>${esc(S.typed)}</s></p>` : ''}
        <div class="promptrow"><p class="correct">${esc(a)}</p>${aEn ? `<button class="iconbtn" type="button" id="sayA" aria-label="Vorlesen">${ICON.sound}</button>` : ''}</div></div>
        <div class="row">${!ok ? '<button class="btn ghost" type="button" id="overrideBtn">Ich hatte es richtig</button>' : ''}<button class="btn primary grow" type="button" id="nextBtn">Weiter</button></div>`;
    }
  } else {
    if (phase === 'ask') {
      body = `<button class="btn primary big" type="button" id="flipBtn">Umdrehen</button>`;
    } else {
      body = `<div class="flipped"><span class="lang">${aLang}</span>
        <div class="promptrow"><p class="prompt">${esc(a)}</p>${aEn ? `<button class="iconbtn" type="button" id="sayA" aria-label="Vorlesen">${ICON.sound}</button>` : ''}</div></div>
        <div class="row"><button class="btn grow" type="button" id="againBtn">Nochmal üben</button><button class="btn good grow" type="button" id="knownBtn">Gewusst</button></div>`;
    }
  }

  $('#quiz').innerHTML = `
    <div class="qbar"><button class="qbtn" type="button" id="setBtn" aria-label="Einstellungen öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Einstellungen</button><span class="qcount">${S.learned.size} / ${S.total}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
    <div class="card">
      <span class="lang">${qLang}</span>
      <div class="promptrow"><div><p class="prompt">${esc(q)}</p></div>
        ${qEn ? `<button class="iconbtn" type="button" id="sayQ" aria-label="Vorlesen">${ICON.sound}</button>` : ''}</div>
      ${body}
    </div>`;

  $('#setBtn').onclick = () => { syncSetup(); show('setup'); };
  const sq = $('#sayQ'); if (sq) sq.onclick = () => speak(q);
  const sa = $('#sayA'); if (sa) sa.onclick = () => speak(a);
  const form = $('#answerForm');
  if (form) {
    const inp = $('#answer'); inp.focus();
    const submitAnswer = () => { if (S.pending) return; S.typed = inp.value.trim(); S.pending = { ok: check(it, dir, inp.value) }; render(); };
    form.onsubmit = e => { e.preventDefault(); submitAnswer(); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); } };
    form.querySelectorAll('button').forEach(bt => {
      bt.addEventListener('pointerdown', e => e.preventDefault());
      bt.addEventListener('mousedown', e => e.preventDefault());
    });
    $('#skipBtn').onclick = () => { S.typed = ''; S.pending = { ok: false }; render(); };
  }
  if ($('#nextBtn')) { $('#nextBtn').onclick = () => resolve(S.pending.ok); $('#nextBtn').focus(); }
  if ($('#overrideBtn')) $('#overrideBtn').onclick = () => resolve(true);
  if ($('#flipBtn')) { $('#flipBtn').onclick = () => { S.flipped = true; render(); }; $('#flipBtn').focus(); }
  if ($('#knownBtn')) { $('#knownBtn').onclick = () => resolve(true); $('#againBtn').onclick = () => resolve(false); $('#knownBtn').focus(); }

  if (cfg.speak) {
    if (phase === 'ask' && qEn) speak(q);
    else if (phase !== 'ask' && aEn && !S.spoken) speak(a);
  }
}
document.addEventListener('keydown', e => {
  if (!S || $('#quiz').hidden || !S.flipped || cfg.mode !== 'cards') return;
  if (e.key === 'ArrowRight') resolve(true);
  if (e.key === 'ArrowLeft') resolve(false);
});

function finish() {
  const missedItems = Object.keys(S.missed).map(id => items[+id]);
  const ratio = S.total ? S.firstTry / S.total : 0;
  const msg = ratio === 1 ? 'Alles auf Anhieb gewusst.' : ratio >= 0.7 ? 'Gut gemacht. Die Fehlerwörter üben sich schnell nach.' : 'Die Fehlerwörter kommen mit etwas Wiederholung.';
  $('#result').innerHTML = `<div class="stack">
    <div class="head"><h1>Runde geschafft</h1><p class="sub">${msg}</p></div>
    <div><h2>Auf Anhieb richtig</h2><p class="score">${S.firstTry}<small>von ${S.total}</small></p></div>
    ${missedItems.length ? `<div><h2>Hier gab es Fehler (${missedItems.length})</h2><ul class="misslist">${missedItems.map(i => `<li><span>${esc(i.en)}</span><span class="de">${esc(i.de)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="row">${missedItems.length ? '<button class="btn primary grow" type="button" id="retryBtn">Fehlerwörter nochmal üben</button>' : ''}<button class="btn grow" type="button" id="againAllBtn">Neue Runde</button><button class="btn ghost grow" type="button" id="backBtn">Einstellungen</button></div></div>`;
  show('result');
  if ($('#retryBtn')) $('#retryBtn').onclick = () => begin(missedItems, true);
  $('#againAllBtn').onclick = () => begin(pool().length ? pool() : items, false);
  $('#backBtn').onclick = () => { syncSetup(); show('setup'); };
}

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.classList && d.classList.contains('unitbox')) { if (d.open) openUnits.add(d.dataset.u); else openUnits.delete(d.dataset.u); cfg.open = [...openUnits]; store.set('gl1-cfg', cfg); }
}, true);
$('#setup').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const u = b.dataset.u, all = b.dataset.act === 'all';
  cfg.skip[u] = all ? [] : UNIT[u].map(i => i.id);
  b.closest('details').querySelectorAll('input[name=word]').forEach(i => { i.checked = all; });
  refreshSummary(u); store.set('gl1-cfg', cfg); updateBar();
});
$('#backToRound').onclick = () => { show(lastView); if (lastView === 'quiz') render(); };
buildSetup();
if (sessionSize() > 0) begin(pool(), false); else show('setup');
}
</script>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptBooks(raw) {
  const pw = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.data));
  return { books: JSON.parse(new TextDecoder().decode(buf)), pw };
}
const lk = id => document.getElementById(id);
function open_(books) { lk('lock').hidden = true; lk('app').hidden = false; boot(books); }
function remember(pw) { try { if (pw === null) localStorage.removeItem('vt-code'); else localStorage.setItem('vt-code', pw); } catch (e) {} }
async function tryCode(raw, silent) {
  if (!window.crypto || !crypto.subtle) { lk('lockErr').textContent = 'Dieser Browser kann den Code nicht prüfen. Bitte Chrome oder Safari über https öffnen.'; return false; }
  try {
    const r = await decryptBooks(raw);
    if (lk('rem') && lk('rem').checked) remember(r.pw);
    open_(r.books); return true;
  } catch (e) {
    if (!silent) lk('lockErr').textContent = 'Der Code stimmt nicht.';
    return false;
  }
}
lk('showBtn').onclick = () => { const i = lk('code'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; lk('showBtn').textContent = show ? 'Verbergen' : 'Zeigen'; };
lk('lockForm').onsubmit = async e => {
  e.preventDefault(); lk('lockErr').textContent = ''; lk('lockBtn').disabled = true; lk('lockBtn').textContent = 'Prüfe …';
  const ok = await tryCode(lk('code').value, false);
  if (!ok) { lk('lockBtn').disabled = false; lk('lockBtn').textContent = 'Öffnen'; lk('code').select(); }
};
(async () => {
  let saved = null; try { saved = localStorage.getItem('vt-code'); } catch (e) {}
  if (saved) { const ok = await tryCode(saved, true); if (!ok) remember(null); }
  if (!lk('lock').hidden) lk('code').focus();
})();
